<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Un pequeño juego ❤️</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #fff5f7, #f8f1ff);
        font-family: Arial, sans-serif;
        color: #333;
    }

    .game {
        width: 90%;
        max-width: 500px;
        background: white;
        padding: 30px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.10);
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 28px;
    }

    .heart {
        font-size: 42px;
        margin-bottom: 10px;
    }

    .question {
        font-size: 21px;
        margin: 25px 0 20px;
        line-height: 1.4;
    }

    input {
        width: 85%;
        padding: 14px;
        font-size: 17px;
        border: 2px solid #ddd;
        border-radius: 12px;
        text-align: center;
        outline: none;
    }

    button {
        margin-top: 15px;
        padding: 13px 25px;
        font-size: 17px;
        border: none;
        border-radius: 12px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:hover {
        opacity: 0.85;
    }

    .message {
        min-height: 25px;
        margin-top: 18px;
        font-size: 17px;
    }

    .final {
        font-size: 20px;
        line-height: 1.6;
    }
</style>
</head>

<body>

<div class="game" id="game">
    <div class="heart">❤️</div>

    <h1>Un pequeño juego</h1>

    <p>
        Vamos a ver qué tan buena memoria tienes.
    </p>

    <div class="question" id="question"></div>

    <input
        type="text"
        id="answer"
        placeholder="Escribe tu respuesta"
        autocomplete="off"
    >

    <br>

    <button onclick="checkAnswer()">Responder</button>

    <div class="message" id="message"></div>
</div>

<script>

const questions = [
    {
        question: "¿Cuál es la capital de Francia?",
        answers: ["paris", "parís"]
    },
    {
        question: "¿Cuántos días tiene una semana?",
        answers: ["7", "siete"]
    },
    {
        question: "¿Cuánto es 2 + 2?",
        answers: ["4", "cuatro"]
    }
];

let currentQuestion = 0;

function showQuestion() {
    document.getElementById("question").textContent =
        "Pregunta " + (currentQuestion + 1) + ": " +
        questions[currentQuestion].question;

    document.getElementById("answer").value = "";
    document.getElementById("message").textContent = "";
}

function normalize(text) {
    return text
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");
}

function checkAnswer() {

    const answer = normalize(
        document.getElementById("answer").value
    );

    const correctAnswers =
        questions[currentQuestion].answers.map(normalize);

    if (correctAnswers.includes(answer)) {

        currentQuestion++;

        if (currentQuestion === questions.length) {

            document.getElementById("game").innerHTML = `
                <div class="heart">❤️</div>

                <h1>¡Lo lograste!</h1>

                <p class="final">
                    Has respondido correctamente las tres preguntas.
                    <br><br>
                    🎉 La prueba funciona perfectamente.
                    <br><br>
                    El verdadero juego puede empezar ahora...
                </p>
            `;

        } else {

            document.getElementById("message").textContent =
                "✅ ¡Correcto!";

            setTimeout(showQuestion, 700);
        }

    } else {

        document.getElementById("message").textContent =
            "❌ Incorrecto... inténtalo otra vez 😏";
    }
}

document.getElementById("answer").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        checkAnswer();
    }
});

showQuestion();

</script>

</body>
</html>
